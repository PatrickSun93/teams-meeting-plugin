<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Meeting Transcription</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/themes.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <img src="assets/icon.png" alt="App Icon" class="app-icon">
                <h1 class="app-title">Meeting Transcription</h1>
            </div>
            <div class="header-right">
                <div class="platform-indicator" id="platformIndicator">
                    <span class="platform-name">No Platform Detected</span>
                    <span class="platform-status">●</span>
                </div>
                <button class="btn btn-icon" id="settingsBtn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97c0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1c0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Control Panel -->
            <section class="control-panel">
                <div class="control-group">
                    <h2>Meeting Control</h2>
                    <div class="control-buttons">
                        <button class="btn btn-primary btn-large" id="startBtn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            Start Recording
                        </button>
                        <button class="btn btn-secondary btn-large" id="stopBtn" disabled>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="6" width="12" height="12"/>
                            </svg>
                            Stop Recording
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Platform Selection</h3>
                    <div class="platform-selection">
                        <select id="platformSelect" class="form-select">
                            <option value="auto">Auto-detect</option>
                            <option value="teams">Microsoft Teams</option>
                            <option value="zoom">Zoom</option>
                            <option value="meet">Google Meet</option>
                            <option value="webex">Cisco Webex</option>
                            <option value="generic">Generic/Other</option>
                        </select>
                        <button class="btn btn-outline" id="detectBtn">Detect Now</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Audio Settings</h3>
                    <div class="audio-settings">
                        <select id="audioDeviceSelect" class="form-select">
                            <option value="default">Default Microphone</option>
                        </select>
                        <div class="audio-level">
                            <label>Audio Level:</label>
                            <div class="level-meter">
                                <div class="level-bar" id="audioLevelBar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Transcription Display -->
            <section class="transcription-panel">
                <div class="panel-header">
                    <h2>Live Transcription</h2>
                    <div class="transcription-controls">
                        <button class="btn btn-icon" id="clearTranscriptBtn" title="Clear Transcript">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                        <button class="btn btn-icon" id="exportTranscriptBtn" title="Export Transcript">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="transcript-container" id="transcriptContainer">
                    <div class="transcript-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" opacity="0.3">
                            <path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/>
                        </svg>
                        <p>Start recording to see live transcription</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left">
                <span class="status-item" id="recordingStatus">Ready</span>
                <span class="status-item" id="platformStatus">No platform detected</span>
            </div>
            <div class="status-right">
                <span class="status-item" id="transcriptionProvider">Local STT</span>
                <span class="status-item" id="appVersion">v1.0.0</span>
            </div>
        </footer>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn btn-icon modal-close" id="closeSettingsBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="settings-tabs">
                        <button class="tab-btn active" data-tab="transcription">Transcription</button>
                        <button class="tab-btn" data-tab="audio">Audio</button>
                        <button class="tab-btn" data-tab="platform">Platform</button>
                        <button class="tab-btn" data-tab="export">Export</button>
                        <button class="tab-btn" data-tab="privacy">Privacy</button>
                        <button class="tab-btn" data-tab="advanced">Advanced</button>
                    </div>
                    
                    <div class="settings-content">
                        <!-- Transcription Settings -->
                        <div class="tab-content active" id="transcription-tab">
                            <div class="form-group">
                                <label for="sttProvider">STT Provider:</label>
                                <select id="sttProvider" class="form-select">
                                    <option value="local">Local (Whisper)</option>
                                    <option value="openai">OpenAI Whisper</option>
                                    <option value="azure">Azure Speech Services</option>
                                    <option value="claude">Claude (if available)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="apiKey">API Key:</label>
                                <input type="password" id="apiKey" class="form-input" placeholder="Enter API key">
                            </div>
                            <div class="form-group">
                                <label for="language">Language:</label>
                                <select id="language" class="form-select">
                                    <option value="en">English</option>
                                    <option value="es">Spanish</option>
                                    <option value="fr">French</option>
                                    <option value="de">German</option>
                                    <option value="it">Italian</option>
                                    <option value="pt">Portuguese</option>
                                    <option value="ru">Russian</option>
                                    <option value="ja">Japanese</option>
                                    <option value="ko">Korean</option>
                                    <option value="zh">Chinese</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="enableSpeakerDiarization">
                                    <span class="checkmark"></span>
                                    Enable Speaker Identification
                                </label>
                            </div>
                        </div>

                        <!-- Audio Settings -->
                        <div class="tab-content" id="audio-tab">
                            <div class="form-group">
                                <label for="sampleRate">Sample Rate:</label>
                                <select id="sampleRate" class="form-select">
                                    <option value="16000">16 kHz (Recommended)</option>
                                    <option value="22050">22.05 kHz</option>
                                    <option value="44100">44.1 kHz</option>
                                    <option value="48000">48 kHz</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="enableNoiseReduction">
                                    <span class="checkmark"></span>
                                    Enable Noise Reduction
                                </label>
                            </div>
                            <div class="form-group">
                                <label for="audioQuality">Audio Quality:</label>
                                <select id="audioQuality" class="form-select">
                                    <option value="low">Low (Faster)</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High (Better Quality)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Platform Settings -->
                        <div class="tab-content" id="platform-tab">
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="autoDetection">
                                    <span class="checkmark"></span>
                                    Enable Auto-Detection
                                </label>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="enableScreenAnalysis">
                                    <span class="checkmark"></span>
                                    Enable Screen Analysis
                                </label>
                            </div>
                            <div class="form-group">
                                <label for="detectionInterval">Detection Interval (ms):</label>
                                <input type="number" id="detectionInterval" class="form-input" min="1000" max="60000" step="1000">
                            </div>
                        </div>

                        <!-- Export Settings -->
                        <div class="tab-content" id="export-tab">
                            <div class="form-group">
                                <label for="defaultFormat">Default Format:</label>
                                <select id="defaultFormat" class="form-select">
                                    <option value="txt">Text (.txt)</option>
                                    <option value="json">JSON (.json)</option>
                                    <option value="pdf">PDF (.pdf)</option>
                                    <option value="docx">Word (.docx)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="includeTimestamps">
                                    <span class="checkmark"></span>
                                    Include Timestamps
                                </label>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="includeSpeakerLabels">
                                    <span class="checkmark"></span>
                                    Include Speaker Labels
                                </label>
                            </div>
                        </div>

                        <!-- Privacy Settings -->
                        <div class="tab-content" id="privacy-tab">
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="enableLocalProcessing">
                                    <span class="checkmark"></span>
                                    Prefer Local Processing
                                </label>
                            </div>
                            <div class="form-group">
                                <label for="dataRetentionDays">Data Retention (days):</label>
                                <input type="number" id="dataRetentionDays" class="form-input" min="1" max="365">
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="enableAnalytics">
                                    <span class="checkmark"></span>
                                    Enable Analytics
                                </label>
                            </div>
                        </div>

                        <!-- Advanced Settings -->
                        <div class="tab-content" id="advanced-tab">
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="enableDebugLogging">
                                    <span class="checkmark"></span>
                                    Enable Debug Logging
                                </label>
                            </div>
                            <div class="form-group">
                                <label for="maxConcurrentTranscriptions">Max Concurrent Transcriptions:</label>
                                <input type="number" id="maxConcurrentTranscriptions" class="form-input" min="1" max="5">
                            </div>
                            <div class="form-group">
                                <button class="btn btn-outline" id="testAudioBtn">Test Audio Capture</button>
                                <button class="btn btn-outline" id="testDetectionBtn">Test Platform Detection</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" id="resetSettingsBtn">Reset to Defaults</button>
                    <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
                </div>
            </div>
        </div>

        <!-- Meeting History Modal -->
        <div class="modal" id="historyModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Meeting History</h2>
                    <button class="btn btn-icon modal-close" id="closeHistoryBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="meeting-list" id="meetingList">
                        <!-- Meeting history items will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div class="notifications" id="notifications"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/transcription.js"></script>
    <script src="js/platform.js"></script>
</body>
</html>
