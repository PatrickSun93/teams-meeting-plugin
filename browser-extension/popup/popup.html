<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Transcription</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6.92h-2z"/>
        </svg>
        <h1>Meeting Transcription</h1>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </button>
    </div>

    <!-- Meeting Status -->
    <div class="meeting-status" id="meeting-status">
      <div class="status-indicator" id="status-indicator"></div>
      <div class="status-info">
        <div class="status-text" id="status-text">Not in meeting</div>
        <div class="meeting-info" id="meeting-info"></div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button id="transcription-toggle" class="action-btn primary" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6.92h-2z"/>
        </svg>
        <span>Start Transcription</span>
      </button>

      <button id="show-panel" class="action-btn secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <span>Show Panel</span>
      </button>
    </div>

    <!-- Configuration Summary -->
    <div class="config-summary">
      <h3>Current Settings</h3>
      <div class="config-item">
        <span class="config-label">STT Provider:</span>
        <span class="config-value" id="stt-provider">Loading...</span>
      </div>
      <div class="config-item">
        <span class="config-label">AI Provider:</span>
        <span class="config-value" id="ai-provider">Loading...</span>
      </div>
      <div class="config-item">
        <span class="config-label">Auto-start:</span>
        <span class="config-value" id="auto-start">Loading...</span>
      </div>
    </div>

    <!-- Recent Transcripts -->
    <div class="recent-transcripts">
      <h3>Recent Transcripts</h3>
      <div class="transcript-list" id="transcript-list">
        <div class="no-transcripts">No recent transcripts</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <button id="help-btn" class="footer-btn">Help</button>
      <button id="feedback-btn" class="footer-btn">Feedback</button>
      <button id="privacy-btn" class="footer-btn">Privacy</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
