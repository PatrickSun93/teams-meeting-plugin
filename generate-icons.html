<!DOCTYPE html>
<html>
<head>
    <title>Generate Teams App Icons</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        button { padding: 10px 20px; margin: 5px; background: #0078d4; color: white; border: none; cursor: pointer; }
        .icon-section { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Teams App Icon Generator</h1>
    
    <div class="icon-section">
        <h3>Color Icon (192x192)</h3>
        <canvas id="colorCanvas" width="192" height="192"></canvas>
        <br>
        <button onclick="downloadIcon('colorCanvas', 'icon-color.png')">Download Color Icon</button>
    </div>
    
    <div class="icon-section">
        <h3>Outline Icon (32x32)</h3>
        <canvas id="outlineCanvas" width="32" height="32"></canvas>
        <br>
        <button onclick="downloadIcon('outlineCanvas', 'icon-outline.png')">Download Outline Icon</button>
    </div>

    <script>
        function createColorIcon() {
            const canvas = document.getElementById('colorCanvas');
            const ctx = canvas.getContext('2d');
            
            // Blue background
            ctx.fillStyle = '#0078d4';
            ctx.fillRect(0, 0, 192, 192);
            
            // White circle for microphone
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(96, 80, 30, 0, 2 * Math.PI);
            ctx.fill();
            
            // Microphone stand
            ctx.fillRect(91, 110, 10, 30);
            ctx.fillRect(81, 135, 30, 8);
            
            // Text
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Meeting', 96, 165);
            ctx.fillText('Transcription', 96, 180);
        }
        
        function createOutlineIcon() {
            const canvas = document.getElementById('outlineCanvas');
            const ctx = canvas.getContext('2d');
            
            // Transparent background
            ctx.clearRect(0, 0, 32, 32);
            
            // White microphone
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(16, 12, 6, 0, 2 * Math.PI);
            ctx.fill();
            
            // Microphone stand
            ctx.fillRect(15, 18, 2, 6);
            ctx.fillRect(12, 23, 8, 2);
        }
        
        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Create icons when page loads
        window.onload = function() {
            createColorIcon();
            createOutlineIcon();
        };
    </script>
</body>
</html>
