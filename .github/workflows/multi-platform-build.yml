name: Multi-Platform Build and Deploy

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Run unit tests
      run: npm run test:unit
      
    - name: Run integration tests
      run: npm run test:integration
      
    - name: Run security tests
      run: npm run test:security
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/

  build-teams:
    name: Build Teams App
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Teams app
      run: node scripts/build-platforms.js teams
      env:
        REACT_APP_PLATFORM: teams
        
    - name: Validate Teams package
      run: node scripts/deploy-validation.js
      
    - name: Upload Teams build
      uses: actions/upload-artifact@v4
      with:
        name: teams-app-package
        path: dist/teams/
        
    - name: Upload Teams zip
      uses: actions/upload-artifact@v4
      with:
        name: teams-app-zip
        path: dist/teams-package.zip

  build-zoom:
    name: Build Zoom App
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Zoom app
      run: node scripts/build-platforms.js zoom
      env:
        REACT_APP_PLATFORM: zoom
        
    - name: Validate Zoom package
      run: node scripts/deploy-validation.js
      
    - name: Upload Zoom build
      uses: actions/upload-artifact@v4
      with:
        name: zoom-app-package
        path: dist/zoom/
        
    - name: Upload Zoom zip
      uses: actions/upload-artifact@v4
      with:
        name: zoom-app-zip
        path: dist/zoom-package.zip

  build-extension:
    name: Build Browser Extension
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build browser extension
      run: node scripts/build-platforms.js extension
      
    - name: Validate extension package
      run: node scripts/deploy-validation.js
      
    - name: Upload extension build
      uses: actions/upload-artifact@v4
      with:
        name: browser-extension-package
        path: dist/browser-extension/
        
    - name: Upload extension zip
      uses: actions/upload-artifact@v4
      with:
        name: browser-extension-zip
        path: dist/browser-extension-package.zip

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build-teams, build-zoom, build-extension]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      
    - name: Install Playwright
      run: npx playwright install --with-deps
      
    - name: Run E2E tests
      run: npm run test:e2e
      
    - name: Upload E2E results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-results
        path: test-results/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [build-teams, build-zoom, build-extension]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      
    - name: Run performance tests
      run: npm run test:performance
      
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: test-results/performance-*.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-teams, build-zoom, build-extension]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run npm audit
      run: npm audit --audit-level moderate
      
    - name: Run security tests
      run: npm run test:security
      
    - name: Download build artifacts for scanning
      uses: actions/download-artifact@v4
      
    - name: Scan build artifacts
      run: |
        echo "Scanning build artifacts for security issues..."
        # Add security scanning tools here (e.g., Snyk, OWASP ZAP)
        
    - name: Upload security results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: test-results/security-*.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Deploy Teams app to staging
      run: |
        echo "Deploying Teams app to staging environment..."
        # Add Teams app deployment logic here
        
    - name: Deploy Zoom app to staging
      run: |
        echo "Deploying Zoom app to staging environment..."
        # Add Zoom app deployment logic here
        
    - name: Deploy extension to staging
      run: |
        echo "Deploying browser extension to staging environment..."
        # Add extension deployment logic here
        
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test logic here

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release notes
      id: release-notes
      run: |
        echo "Creating release notes..."
        # Generate release notes from commits
        
    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: ${{ steps.release-notes.outputs.notes }}
        draft: false
        prerelease: false
        
    - name: Upload Teams app to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: teams-app-zip/teams-package.zip
        asset_name: teams-app-${{ github.ref_name }}.zip
        asset_content_type: application/zip
        
    - name: Upload Zoom app to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: zoom-app-zip/zoom-package.zip
        asset_name: zoom-app-${{ github.ref_name }}.zip
        asset_content_type: application/zip
        
    - name: Upload browser extension to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: browser-extension-zip/browser-extension-package.zip
        asset_name: browser-extension-${{ github.ref_name }}.zip
        asset_content_type: application/zip

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      
    - name: Submit Teams app to store
      run: |
        echo "Submitting Teams app to Microsoft Teams App Store..."
        # Add Teams App Store submission logic here
        
    - name: Submit Zoom app to marketplace
      run: |
        echo "Submitting Zoom app to Zoom App Marketplace..."
        # Add Zoom Marketplace submission logic here
        
    - name: Submit extension to Chrome Web Store
      run: |
        echo "Submitting browser extension to Chrome Web Store..."
        # Add Chrome Web Store submission logic here
        
    - name: Notify deployment completion
      run: |
        echo "Production deployment completed successfully!"
        # Add notification logic here (Slack, email, etc.)