name: Cross-Platform Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_VERSION: '1.40.0'

jobs:
  # Platform Detection and Setup
  setup:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.detect-platforms.outputs.platforms }}
      test-matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect supported platforms
        id: detect-platforms
        run: |
          PLATFORMS=$(node -e "
            const fs = require('fs');
            const adapters = fs.readdirSync('src/client/services')
              .filter(f => f.includes('Adapter.js') && !f.includes('Platform'))
              .map(f => f.replace('Adapter.js', '').toLowerCase());
            console.log(JSON.stringify(adapters));
          ")
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT

      - name: Create test matrix
        id: create-matrix
        env:
          PLATFORMS_JSON: ${{ steps.detect-platforms.outputs.platforms }}
        run: |
          MATRIX=$(node -e "
            const platforms = JSON.parse(process.env.PLATFORMS_JSON);
            const browsers = ['chromium', 'firefox', 'webkit'];
            const testTypes = ['unit', 'integration', 'e2e', 'performance', 'accessibility', 'security'];
            const matrix = {
              include: []
            };
            
            platforms.forEach(platform => {
              testTypes.forEach(testType => {
                if (testType === 'e2e') {
                  browsers.forEach(browser => {
                    matrix.include.push({
                      platform,
                      testType,
                      browser,
                      os: 'ubuntu-latest'
                    });
                  });
                } else {
                  matrix.include.push({
                    platform,
                    testType,
                    browser: 'chromium',
                    os: 'ubuntu-latest'
                  });
                }
              });
            });
            
            console.log(JSON.stringify(matrix));
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # Cross-Platform Integration Tests
  integration-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['teams', 'zoom', 'meet', 'generic']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run platform adapter integration tests
        run: |
          npm run test:integration -- \
            --testPathPattern="cross-platform-adapters" \
            --testNamePattern="${{ matrix.platform }}"
        env:
          PLATFORM: ${{ matrix.platform }}
          CI: true

      - name: Run platform error handling tests
        run: |
          npm run test:integration -- \
            --testPathPattern="platform-error-handling" \
            --testNamePattern="${{ matrix.platform }}"
        env:
          PLATFORM: ${{ matrix.platform }}
          CI: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.platform }}
          path: |
            test-results/
            coverage/

  # End-to-End Cross-Platform Tests
  e2e-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['teams', 'zoom', 'meet']
        browser: ['chromium', 'firefox', 'webkit']
        exclude:
          # Exclude webkit for Teams (not supported)
          - platform: teams
            browser: webkit
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests for ${{ matrix.platform }}
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --grep="${{ matrix.platform }}" \
            tests/e2e/multi-platform-workflow.spec.js
        env:
          PLATFORM: ${{ matrix.platform }}
          BROWSER: ${{ matrix.browser }}
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.platform }}-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/

  # Performance Tests Across Platforms
  performance-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['teams', 'zoom', 'meet', 'generic']
        test-type: ['audio-processing', 'transcription', 'memory-usage']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: |
          npm run test:performance -- \
            --testPathPattern="multi-platform-audio" \
            --testNamePattern="${{ matrix.platform }}.*${{ matrix.test-type }}"
        env:
          PLATFORM: ${{ matrix.platform }}
          TEST_TYPE: ${{ matrix.test-type }}
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Generate performance report
        run: |
          node scripts/generate-performance-report.js \
            --platform=${{ matrix.platform }} \
            --test-type=${{ matrix.test-type }}

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results-${{ matrix.platform }}-${{ matrix.test-type }}
          path: |
            test-results/performance-*.json
            performance-reports/

  # Accessibility Tests Across Platforms
  accessibility-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['teams', 'zoom', 'meet', 'generic']
        viewport: ['mobile', 'tablet', 'desktop']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        run: |
          npm run test:accessibility -- \
            --testPathPattern="cross-platform-ui" \
            --testNamePattern="${{ matrix.platform }}"
        env:
          PLATFORM: ${{ matrix.platform }}
          VIEWPORT: ${{ matrix.viewport }}
          CI: true

      - name: Generate accessibility report
        run: |
          node scripts/generate-accessibility-report.js \
            --platform=${{ matrix.platform }} \
            --viewport=${{ matrix.viewport }}

      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results-${{ matrix.platform }}-${{ matrix.viewport }}
          path: |
            test-results/accessibility-*.json
            accessibility-reports/

  # Security Tests Across Platforms
  security-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['teams', 'zoom', 'meet', 'generic']
        security-aspect: ['encryption', 'privacy', 'audit', 'compliance']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: |
          npm run test:security -- \
            --testPathPattern="cross-platform-data" \
            --testNamePattern="${{ matrix.platform }}.*${{ matrix.security-aspect }}"
        env:
          PLATFORM: ${{ matrix.platform }}
          SECURITY_ASPECT: ${{ matrix.security-aspect }}
          CI: true

      - name: Generate security report
        run: |
          node scripts/generate-security-report.js \
            --platform=${{ matrix.platform }} \
            --aspect=${{ matrix.security-aspect }}

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results-${{ matrix.platform }}-${{ matrix.security-aspect }}
          path: |
            test-results/security-*.json
            security-reports/

  # Cross-Platform Compatibility Matrix
  compatibility-matrix:
    needs: [integration-tests, e2e-tests, performance-tests, accessibility-tests, security-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/

      - name: Install dependencies
        run: npm ci

      - name: Generate compatibility matrix
        run: |
          node scripts/generate-compatibility-matrix.js \
            --input-dir=test-artifacts/ \
            --output-dir=compatibility-reports/

      - name: Generate cross-platform test summary
        run: |
          node scripts/generate-test-summary.js \
            --input-dir=test-artifacts/ \
            --output-file=test-summary.json

      - name: Upload compatibility matrix
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-matrix
          path: |
            compatibility-reports/
            test-summary.json

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('test-summary.json', 'utf8'));
            
            const comment = `
            ## 🧪 Cross-Platform Test Results
            
            | Platform | Integration | E2E | Performance | Accessibility | Security |
            |----------|-------------|-----|-------------|---------------|----------|
            ${summary.platforms.map(platform => 
              `| ${platform.name} | ${platform.integration ? '✅' : '❌'} | ${platform.e2e ? '✅' : '❌'} | ${platform.performance ? '✅' : '❌'} | ${platform.accessibility ? '✅' : '❌'} | ${platform.security ? '✅' : '❌'} |`
            ).join('\n')}
            
            **Overall Status:** ${summary.overallStatus ? '✅ PASS' : '❌ FAIL'}
            
            **Test Coverage:** ${summary.coverage}%
            
            **Performance Benchmarks:**
            - Audio Processing: ${summary.performance.audioProcessing}ms avg
            - Transcription Latency: ${summary.performance.transcriptionLatency}ms avg
            - Memory Usage: ${summary.performance.memoryUsage}MB avg
            
            [View detailed compatibility matrix](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Deployment Readiness Check
  deployment-readiness:
    needs: compatibility-matrix
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: compatibility-matrix
          path: compatibility-reports/

      - name: Check deployment readiness
        run: |
          node scripts/check-deployment-readiness.js \
            --compatibility-report=compatibility-reports/matrix.json \
            --min-coverage=80 \
            --required-platforms=teams,zoom,meet

      - name: Create deployment tag
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-$(date +%Y%m%d%H%M%S)"
          
          git tag $TAG
          git push origin $TAG

      - name: Trigger multi-platform deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'multi-platform-deploy.yml',
              ref: 'main',
              inputs: {
                platforms: 'teams,zoom,meet',
                environment: 'production'
              }
            });

  # Cleanup
  cleanup:
    needs: [compatibility-matrix, deployment-readiness]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            // Keep only the latest 5 runs worth of artifacts
            const oldArtifacts = artifacts.data.artifacts
              .filter(artifact => artifact.created_at < new Date(Date.now() - 5 * 24 * 60 * 60 * 1000))
              .slice(0, 50); // Limit to 50 to avoid API rate limits
            
            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }